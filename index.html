<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#24105a">
<meta name="description" content="Антистресс — игрушки: поп-ит, пупырка, пузыри, слайм, мыло, шарики, песок, неон, магнит, спиннер. Без лагов, 120Hz, Full HD.">
<meta property="og:title" content="Антистресс — игрушки-антистресс">
<meta property="og:description" content="Поп-ит, слайм, мыло, шарики, песок, неон, магнит, спиннер. Снимай стресс красиво.">
<meta property="og:type" content="website">
<title>Антистресс — игрушки-антистресс</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="c" aria-label="Игра-антистресс"></canvas>

<div id="ui">
  <header class="top">
    <div class="score glass" id="score" aria-live="polite"><i></i><span id="scoreText">…</span></div>
    <div class="tools">
      <button class="ico glass" id="btnLang" title="Language / Язык">RU</button>
      <button class="ico glass icon-only" id="btnTheme" aria-label="Тема" title="Тема / Theme"><span class="dot"></span></button>
      <button class="ico glass icon-only" id="btnSound" aria-label="Звук" aria-pressed="true" title="Звук (M)"></button>
      <button class="ico glass icon-only" id="btnReset" aria-label="Заново" title="Заново (R)">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>
      </button>
      <button class="ico glass icon-only" id="btnFull" aria-label="Во весь экран" title="Во весь экран (F)">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="toast glass" id="toast" role="status"></div>
  <div class="hint" id="hint"></div>

  <nav class="chips" id="chips" aria-label="Варианты">
    <span data-group="pop">
      <button class="chip glass" data-shape="grid" aria-pressed="true">Прямоугольник</button>
      <button class="chip glass" data-shape="heart" aria-pressed="false">Сердце</button>
      <button class="chip glass" data-shape="circle" aria-pressed="false">Круг</button>
    </span>
    <span data-group="soap">
      <button class="chip dot glass" data-soap="0" aria-pressed="true" style="background:#f6e6cb" title="Кремовый"></button>
      <button class="chip dot glass" data-soap="1" aria-pressed="false" style="background:#f6cfd8" title="Роза"></button>
      <button class="chip dot glass" data-soap="2" aria-pressed="false" style="background:#cdeeda" title="Мята"></button>
      <button class="chip dot glass" data-soap="3" aria-pressed="false" style="background:#ddd3f5" title="Лаванда"></button>
      <button class="chip dot glass" data-soap="4" aria-pressed="false" style="background:#cfe6f7" title="Небо"></button>
      <button class="chip dot glass" data-soap="5" aria-pressed="false" style="background:#f7e3b0" title="Мёд"></button>
    </span>
    <span data-group="sand">
      <button class="chip dot glass" data-sand="0" aria-pressed="true" style="background:#eec687" title="Золотой"></button>
      <button class="chip dot glass" data-sand="1" aria-pressed="false" style="background:#f0bec8" title="Роза"></button>
      <button class="chip dot glass" data-sand="2" aria-pressed="false" style="background:#b9e1c3" title="Мята"></button>
      <button class="chip dot glass" data-sand="3" aria-pressed="false" style="background:#afd2f0" title="Небо"></button>
    </span>
    <span data-group="glow">
      <button class="chip dot glass" data-glow="0" aria-pressed="false" style="background:hsl(0,100%,60%)" title="Красный"></button>
      <button class="chip dot glass" data-glow="1" aria-pressed="false" style="background:hsl(32,100%,55%)" title="Оранжевый"></button>
      <button class="chip dot glass" data-glow="2" aria-pressed="false" style="background:hsl(55,100%,55%)" title="Жёлтый"></button>
      <button class="chip dot glass" data-glow="3" aria-pressed="false" style="background:hsl(130,90%,55%)" title="Зелёный"></button>
      <button class="chip dot glass" data-glow="4" aria-pressed="false" style="background:hsl(190,100%,55%)" title="Голубой"></button>
      <button class="chip dot glass" data-glow="5" aria-pressed="false" style="background:hsl(265,100%,65%)" title="Фиолетовый"></button>
      <button class="chip dot glass" data-glow="6" aria-pressed="false" style="background:hsl(315,100%,60%)" title="Розовый"></button>
      <button class="chip dot glass" data-glow="7" aria-pressed="true" style="background:conic-gradient(#ff4d6d,#ff9236,#ffd43b,#34d986,#3aa8ff,#a15cff,#ff4d6d)" title="Радуга"></button>
      <button class="chip mini glass" data-gloww="0" aria-pressed="false" title="Тонко">S</button>
      <button class="chip mini glass" data-gloww="1" aria-pressed="true" title="Средне">M</button>
      <button class="chip mini glass" data-gloww="2" aria-pressed="false" title="Толсто">L</button>
    </span>
    <span data-group="slime">
      <button class="chip dot glass" data-slime="0" aria-pressed="true" style="background:hsl(320,85%,65%)" title="Розовый"></button>
      <button class="chip dot glass" data-slime="1" aria-pressed="false" style="background:hsl(280,85%,65%)" title="Фиолет"></button>
      <button class="chip dot glass" data-slime="2" aria-pressed="false" style="background:hsl(190,90%,55%)" title="Мята"></button>
      <button class="chip dot glass" data-slime="3" aria-pressed="false" style="background:hsl(130,80%,55%)" title="Лайм"></button>
      <button class="chip dot glass" data-slime="4" aria-pressed="false" style="background:hsl(45,95%,60%)" title="Мёд"></button>
      <button class="chip dot glass" data-slime="5" aria-pressed="false" style="background:hsl(0,85%,62%)" title="Красный"></button>
      <button class="chip mini glass" data-slimevi="0" aria-pressed="false" title="Мягкий">~</button>
      <button class="chip mini glass" data-slimevi="1" aria-pressed="true" title="Средний">≈</button>
      <button class="chip mini glass" data-slimevi="2" aria-pressed="false" title="Твёрдый">●</button>
    </span>
  </nav>

  <div class="spinbar hidden" id="spinBar">
    <button class="chip glass" id="skinBtn" aria-haspopup="listbox" aria-expanded="false">Спиннер ▾</button>
    <button class="chip glass spininfo" id="spinInfo" aria-label="Как крутить спиннер"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".4"/></svg></button>
  </div>
  <div class="skindrop glass hidden" id="skinDrop" role="listbox" aria-label="Скины"></div>

  <nav class="dock glass" id="dock" role="tablist" aria-label="Игрушки">
    <button class="tab" role="tab" data-mode="pop" aria-selected="true">
      <svg viewBox="0 0 24 24"><circle cx="7.5" cy="7.5" r="3.2"/><circle cx="16.5" cy="7.5" r="3.2"/><circle cx="7.5" cy="16.5" r="3.2"/><circle cx="16.5" cy="16.5" r="3.2"/></svg><span class="lbl">Поп-ит</span>
    </button>
    <button class="tab" role="tab" data-mode="wrap" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 9.6a5 5 0 0 1 3-2.7"/></svg><span class="lbl">Пупырка</span>
    </button>
    <button class="tab" role="tab" data-mode="bubbles" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="14.5" r="5.5"/><circle cx="17.5" cy="7.5" r="3"/><path d="M6.5 12.5a3 3 0 0 1 1.8-1.8"/></svg><span class="lbl">Пузыри</span>
    </button>
    <button class="tab" role="tab" data-mode="slime" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 3c3.5 4.5 6.5 7.8 6.5 12a6.5 6.5 0 0 1-13 0C5.5 10.8 8.5 7.5 12 3z"/><path d="M9 14.5a3.2 3.2 0 0 0 2.6 3.2"/></svg><span class="lbl">Слайм</span>
    </button>
    <button class="tab" role="tab" data-mode="soap" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="7" rx="2.5"/><path d="M7 12.5h4M13.5 9L19 3.5M14.5 12.5h3"/></svg><span class="lbl">Мыло</span>
    </button>
    <button class="tab" role="tab" data-mode="ball" aria-selected="false">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="6" ry="7"/><path d="M12 16v2.5c0 1.5-1 2-2 3"/></svg><span class="lbl">Шарики</span>
    </button>
    <button class="tab" role="tab" data-mode="sand" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M3 18c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 3 2"/><path d="M5 14c1.5-3 3.5-5 7-5s5.5 2 7 5"/></svg><span class="lbl">Песок</span>
    </button>
    <button class="tab" role="tab" data-mode="glow" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/><circle cx="12" cy="12" r="2.6"/></svg><span class="lbl">Неон</span>
    </button>
    <button class="tab" role="tab" data-mode="ferro" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M6 3.5v7a6 6 0 0 0 12 0v-7"/><path d="M6 3.5h4v4.5H6zM14 3.5h4v4.5h-4z"/></svg><span class="lbl">Магнит</span>
    </button>
    <button class="tab" role="tab" data-mode="spin" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="5.5" r="2.6"/><circle cx="5.8" cy="15.8" r="2.6"/><circle cx="18.2" cy="15.8" r="2.6"/></svg><span class="lbl">Спиннер</span>
    </button>
  </nav>
</div>

<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>

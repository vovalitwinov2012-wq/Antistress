<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1470">
<meta name="description" content="Антистресс — 7 игрушек: поп-ит, пупырка, пузыри, слайм, нарезка мыла, шарики, песок. Без лагов, 120Hz, Full HD. / Antistress — 7 fidget toys.">
<meta property="og:title" content="Антистресс — 7 игрушек">
<meta property="og:description" content="Поп-ит, слайм, мыло, шарики, песок. Снимай стресс красиво.">
<meta property="og:type" content="website">
<title>Антистресс — 7 игрушек</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="c" aria-label="Игра-антистресс"></canvas>

<div id="ui">
  <header class="top">
    <div class="score glass" id="score" aria-live="polite"><i></i><span id="scoreText">…</span></div>
    <div class="tools">
      <button class="ico glass" id="btnLang" title="Language / Язык">RU</button>
      <button class="ico glass icon-only" id="btnTheme" title="Тема / Theme"><span class="dot"></span></button>
      <button class="ico glass icon-only" id="btnSound" aria-label="Звук" aria-pressed="true" title="Звук (M)"></button>
      <button class="ico glass icon-only" id="btnReset" aria-label="Заново" title="Заново (R)">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>
      </button>
      <button class="ico glass icon-only" id="btnFull" aria-label="Во весь экран" title="Во весь экран (F)">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="toast glass" id="toast" role="status"></div>
  <div class="hint" id="hint"></div>

  <nav class="chips" id="chips" aria-label="Форма поп-ита">
    <button class="chip glass" data-shape="grid" aria-pressed="true">Радуга</button>
    <button class="chip glass" data-shape="heart" aria-pressed="false">Сердце</button>
    <button class="chip glass" data-shape="circle" aria-pressed="false">Круг</button>
  </nav>

  <nav class="dock glass" id="dock" role="tablist" aria-label="Игрушки">
    <button class="tab" role="tab" data-mode="pop" aria-selected="true">
      <svg viewBox="0 0 24 24"><circle cx="7.5" cy="7.5" r="3.2"/><circle cx="16.5" cy="7.5" r="3.2"/><circle cx="7.5" cy="16.5" r="3.2"/><circle cx="16.5" cy="16.5" r="3.2"/></svg><span class="lbl">Поп-ит</span>
    </button>
    <button class="tab" role="tab" data-mode="wrap" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 9.6a5 5 0 0 1 3-2.7"/></svg><span class="lbl">Пупырка</span>
    </button>
    <button class="tab" role="tab" data-mode="bubbles" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="14.5" r="5.5"/><circle cx="17.5" cy="7.5" r="3"/><path d="M6.5 12.5a3 3 0 0 1 1.8-1.8"/></svg><span class="lbl">Пузыри</span>
    </button>
    <button class="tab" role="tab" data-mode="slime" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 3c3.5 4.5 6.5 7.8 6.5 12a6.5 6.5 0 0 1-13 0C5.5 10.8 8.5 7.5 12 3z"/><path d="M9 14.5a3.2 3.2 0 0 0 2.6 3.2"/></svg><span class="lbl">Слайм</span>
    </button>
    <button class="tab" role="tab" data-mode="soap" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="7" rx="2.5"/><path d="M7 12.5h4M13.5 9L19 3.5M14.5 12.5h3"/></svg><span class="lbl">Мыло</span>
    </button>
    <button class="tab" role="tab" data-mode="ball" aria-selected="false">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="6" ry="7"/><path d="M12 16v2.5c0 1.5-1 2-2 3"/></svg><span class="lbl">Шарики</span>
    </button>
    <button class="tab" role="tab" data-mode="sand" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M3 18c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 3 2"/><path d="M5 14c1.5-3 3.5-5 7-5s5.5 2 7 5"/></svg><span class="lbl">Песок</span>
    </button>
  </nav>
</div>

<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
